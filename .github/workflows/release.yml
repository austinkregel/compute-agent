name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  # Optional: notify control-plane that a new agent version exists.
  VERSION_RELEASE_WEBHOOK_URL: ${{ secrets.VERSION_RELEASE_WEBHOOK_URL }}
  VERSION_RELEASE_WEBHOOK_SECRET: ${{ secrets.VERSION_RELEASE_WEBHOOK_SECRET }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: make test

  # Build Linux binaries with CGO for WebView/kiosk support
  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install cross-compilation tools
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt-get install -y libgtk-3-dev:arm64 libwebkit2gtk-4.1-dev:arm64 || true

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Linux ${{ matrix.arch }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
          CXX: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-g++' || 'g++' }}
        run: |
          mkdir -p dist
          # For arm64 cross-compile, fall back to CGO_ENABLED=0 if cross-deps unavailable
          if [ "${{ matrix.arch }}" == "arm64" ]; then
            export CGO_ENABLED=0
          fi
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Version=${VERSION}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Commit=${SHA}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.BuildDate=${BUILD_DATE}'" \
            -o "dist/backup-agent-linux-${{ matrix.arch }}" \
            ./cmd/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-agent-linux-${{ matrix.arch }}
          path: dist/backup-agent-linux-${{ matrix.arch }}
          retention-days: 1

  # Build macOS binaries with CGO for WebView/kiosk support
  build-macos:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build macOS ${{ matrix.arch }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Version=${VERSION}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Commit=${SHA}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.BuildDate=${BUILD_DATE}'" \
            -o "dist/backup-agent-darwin-${{ matrix.arch }}" \
            ./cmd/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-agent-darwin-${{ matrix.arch }}
          path: dist/backup-agent-darwin-${{ matrix.arch }}
          retention-days: 1

  # Build Windows binaries with CGO for WebView2/kiosk support
  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build metadata
        id: meta
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Windows amd64
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Version=${VERSION}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Commit=${SHA}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.BuildDate=${BUILD_DATE}'" \
            -o "dist/backup-agent-windows-amd64.exe" \
            ./cmd/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-agent-windows-amd64
          path: dist/backup-agent-windows-amd64.exe
          retention-days: 1

  # Collect all binaries and create release
  release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/binaries

      - name: Organize binaries
        run: |
          mkdir -p dist/release
          # Move all binaries to a flat structure
          find dist/binaries -type f -name 'backup-agent-*' -exec mv {} dist/ \;

      - name: Create release archive
        run: |
          cd dist
          mkdir -p release
          VERSION="${{ steps.version.outputs.version }}"
          for file in backup-agent-*; do
            if [[ "$file" == *.exe ]]; then
              # Windows executable
              zip "release/${file%.exe}-${VERSION}.zip" "$file"
            else
              # Unix executable
              tar -czf "release/${file}-${VERSION}.tar.gz" "$file"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/release/*
          retention-days: 30

      - name: Create checksums
        run: |
          cd dist/release
          sha256sum * > checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/release/checksums.txt
          retention-days: 30

      - name: Create GitHub Release
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: |
            dist/release/backup-agent*
            dist/release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify control-plane webhook (version release)
        if: env.VERSION_RELEASE_WEBHOOK_SECRET != ''
        env:
          WEBHOOK_URL: ${{ env.VERSION_RELEASE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ env.VERSION_RELEASE_WEBHOOK_SECRET }}
          RAW_VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          WEBHOOK_URL="${WEBHOOK_URL:-https://monitor.kratos.kregel.host/github-version-release}"
          BODY=$(python3 - <<'PY'
          import json, os
          body = {
            "source": "compute-release",
            "repo": os.environ.get("GITHUB_REPOSITORY", ""),
            "sha": os.environ.get("SHA", ""),
            "ref": os.environ.get("GITHUB_REF", ""),
            "runId": os.environ.get("GITHUB_RUN_ID", ""),
            "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
            "version": os.environ.get("RAW_VERSION", ""),
          }
          print(json.dumps(body, separators=(",",":")))
          PY
          )
          SIG=$(python3 - <<'PY' "$BODY"
          import hmac, hashlib, os, sys
          body = sys.argv[1].encode("utf-8")
          secret = os.environ["WEBHOOK_SECRET"].encode("utf-8")
          print(hmac.new(secret, body, hashlib.sha256).hexdigest())
          PY
          )
          echo "Posting webhook to: $WEBHOOK_URL"
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "X-Kratos-Signature: sha256=$SIG" \
            --data "$BODY" \
            "$WEBHOOK_URL"

