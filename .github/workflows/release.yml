name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  # Optional: notify control-plane that a new agent version exists.
  VERSION_RELEASE_WEBHOOK_URL: ${{ secrets.VERSION_RELEASE_WEBHOOK_URL }}
  VERSION_RELEASE_WEBHOOK_SECRET: ${{ secrets.VERSION_RELEASE_WEBHOOK_SECRET }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: make test

  # Build headless binaries (no CGO, works on servers without GUI)
  build-headless:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            goarch: amd64
          - os: linux
            arch: arm64
            goarch: arm64
          - os: linux
            arch: arm
            goarch: arm
          - os: darwin
            arch: amd64
            goarch: amd64
          - os: darwin
            arch: arm64
            goarch: arm64
          - os: windows
            arch: amd64
            goarch: amd64
            ext: .exe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build headless ${{ matrix.os }}-${{ matrix.arch }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Version=${VERSION}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Commit=${SHA}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.BuildDate=${BUILD_DATE}'" \
            -o "dist/backup-agent-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" \
            ./cmd/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/backup-agent-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          retention-days: 1

  # Build Linux kiosk binaries (with CGO for WebView support)
  build-linux-kiosk:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Linux ${{ matrix.arch }} kiosk
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Version=${VERSION}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Commit=${SHA}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.BuildDate=${BUILD_DATE}'" \
            -o "dist/backup-agent-linux-${{ matrix.arch }}-kiosk" \
            ./cmd/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-agent-linux-${{ matrix.arch }}-kiosk
          path: dist/backup-agent-linux-${{ matrix.arch }}-kiosk
          retention-days: 1

  # Build Linux ARM64 kiosk using native ARM64 runner
  build-linux-arm64-kiosk:
    needs: test
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Linux arm64 kiosk
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: arm64
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Version=${VERSION}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Commit=${SHA}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.BuildDate=${BUILD_DATE}'" \
            -o "dist/backup-agent-linux-arm64-kiosk" \
            ./cmd/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-agent-linux-arm64-kiosk
          path: dist/backup-agent-linux-arm64-kiosk
          retention-days: 1

  # Build Linux ARM (32-bit) kiosk - skip if no native runner available
  # Note: ARM32 kiosk builds require a native ARM32 runner which is rare
  # Users needing ARM32 kiosk can build locally

  # Build macOS kiosk binaries (with CGO for WebKit support)
  build-macos-kiosk:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build macOS ${{ matrix.arch }} kiosk
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Version=${VERSION}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Commit=${SHA}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.BuildDate=${BUILD_DATE}'" \
            -o "dist/backup-agent-darwin-${{ matrix.arch }}-kiosk" \
            ./cmd/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-agent-darwin-${{ matrix.arch }}-kiosk
          path: dist/backup-agent-darwin-${{ matrix.arch }}-kiosk
          retention-days: 1

  # Build Windows kiosk binaries (with CGO)
  build-windows-kiosk:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build metadata
        id: meta
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Windows amd64 kiosk
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Version=${VERSION}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.Commit=${SHA}' \
              -X 'github.com/austinkregel/compute-agent/pkg/version.BuildDate=${BUILD_DATE}'" \
            -o "dist/backup-agent-windows-amd64-kiosk.exe" \
            ./cmd/agent

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-agent-windows-amd64-kiosk
          path: dist/backup-agent-windows-amd64-kiosk.exe
          retention-days: 1

  # Collect all binaries and create release
  release:
    needs: [build-headless, build-linux-kiosk, build-linux-arm64-kiosk, build-macos-kiosk, build-windows-kiosk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Determine build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/binaries

      - name: Organize binaries
        run: |
          mkdir -p dist/release
          # Move all binaries to a flat structure
          find dist/binaries -type f -name 'backup-agent-*' -exec mv {} dist/ \;

      - name: Create release archive
        run: |
          cd dist
          mkdir -p release
          VERSION="${{ steps.version.outputs.version }}"
          for file in backup-agent-*; do
            if [[ "$file" == *.exe ]]; then
              # Windows executable
              zip "release/${file%.exe}-${VERSION}.zip" "$file"
            else
              # Unix executable
              tar -czf "release/${file}-${VERSION}.tar.gz" "$file"
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/release/*
          retention-days: 30

      - name: Create checksums
        run: |
          cd dist/release
          sha256sum * > checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/release/checksums.txt
          retention-days: 30

      - name: Create GitHub Release
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Agent Binaries

            Each platform/architecture is available in two variants:
            - **Headless**: For servers, VMs, containers, and headless environments (no GUI dependencies)
            - **Kiosk**: For desktop/display machines with kiosk mode support (requires GUI libraries)

            ### Linux

            | Architecture | Headless | Kiosk |
            | --- | --- | --- |
            | x86_64 (amd64) | `backup-agent-linux-amd64` | `backup-agent-linux-amd64-kiosk` |
            | ARM64 | `backup-agent-linux-arm64` | `backup-agent-linux-arm64-kiosk` |
            | ARM (32-bit) | `backup-agent-linux-arm` | _(build locally)_ |

            **Kiosk runtime requirements**: `apt install libgtk-3-0 libwebkit2gtk-4.1-0`

            ### macOS

            | Architecture | Headless | Kiosk |
            | --- | --- | --- |
            | Intel (amd64) | `backup-agent-darwin-amd64` | `backup-agent-darwin-amd64-kiosk` |
            | Apple Silicon (arm64) | `backup-agent-darwin-arm64` | `backup-agent-darwin-arm64-kiosk` |

            ### Windows

            | Architecture | Headless | Kiosk |
            | --- | --- | --- |
            | x86_64 (amd64) | `backup-agent-windows-amd64.exe` | `backup-agent-windows-amd64-kiosk.exe` |

            **Kiosk runtime requirements**: Microsoft Edge browser
          files: |
            dist/release/backup-agent*
            dist/release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify control-plane webhook (version release)
        if: env.VERSION_RELEASE_WEBHOOK_SECRET != ''
        env:
          WEBHOOK_URL: ${{ env.VERSION_RELEASE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ env.VERSION_RELEASE_WEBHOOK_SECRET }}
          RAW_VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          WEBHOOK_URL="${WEBHOOK_URL:-https://monitor.kratos.kregel.host/github-version-release}"
          BODY=$(python3 - <<'PY'
          import json, os
          body = {
            "source": "compute-release",
            "repo": os.environ.get("GITHUB_REPOSITORY", ""),
            "sha": os.environ.get("SHA", ""),
            "ref": os.environ.get("GITHUB_REF", ""),
            "runId": os.environ.get("GITHUB_RUN_ID", ""),
            "runAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
            "version": os.environ.get("RAW_VERSION", ""),
          }
          print(json.dumps(body, separators=(",",":")))
          PY
          )
          SIG=$(python3 - <<'PY' "$BODY"
          import hmac, hashlib, os, sys
          body = sys.argv[1].encode("utf-8")
          secret = os.environ["WEBHOOK_SECRET"].encode("utf-8")
          print(hmac.new(secret, body, hashlib.sha256).hexdigest())
          PY
          )
          echo "Posting webhook to: $WEBHOOK_URL"
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -H "X-Kratos-Signature: sha256=$SIG" \
            --data "$BODY" \
            "$WEBHOOK_URL"
