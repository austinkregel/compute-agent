<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }
        #kiosk-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        #kiosk-blank {
            display: none;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #0f172a;
        }
        #kiosk-message {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            max-width: 80%;
        }
        #kiosk-message h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #f1f5f9;
            font-weight: 600;
        }
        #kiosk-message p {
            font-size: 1.5rem;
            line-height: 1.6;
            color: #94a3b8;
            white-space: pre-wrap;
        }
        #kiosk-iframe {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── Dashboard view ── */
        #kiosk-dashboard {
            display: none;
            width: 100%;
            height: 100%;
            padding: 2.5rem;
            overflow-y: auto;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        .dash-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #334155;
        }
        .dash-hostname {
            font-size: 2rem;
            font-weight: 600;
            color: #f1f5f9;
            letter-spacing: -0.025em;
        }
        .dash-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.8125rem;
            color: #94a3b8;
        }
        .dash-meta-item {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .dash-meta-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #475569;
        }
        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }
        .dash-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: border-color 0.2s;
        }
        .dash-card:hover {
            border-color: #475569;
        }
        .dash-card-label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
            margin-bottom: 0.75rem;
        }
        .dash-card-value {
            font-size: 1.75rem;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.2;
        }
        .dash-card-sub {
            font-size: 0.8125rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        /* Progress / gauge bars */
        .gauge-track {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 999px;
            margin-top: 0.75rem;
            overflow: hidden;
        }
        .gauge-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s;
            min-width: 2px;
        }
        .gauge-green  { background: #22c55e; }
        .gauge-yellow { background: #eab308; }
        .gauge-orange { background: #f97316; }
        .gauge-red    { background: #ef4444; }

        /* Circular gauge for CPU */
        .ring-gauge {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto;
        }
        .ring-gauge svg {
            transform: rotate(-90deg);
        }
        .ring-bg {
            fill: none;
            stroke: #334155;
            stroke-width: 8;
        }
        .ring-fill {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s;
        }
        .ring-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.375rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        /* Battery indicator */
        .battery-shell {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .battery-icon {
            width: 40px;
            height: 20px;
            border: 2px solid #64748b;
            border-radius: 3px;
            position: relative;
            display: flex;
            align-items: center;
            padding: 2px;
        }
        .battery-icon::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 5px;
            width: 3px;
            height: 8px;
            background: #64748b;
            border-radius: 0 2px 2px 0;
        }
        .battery-level {
            height: 100%;
            border-radius: 1px;
            transition: width 0.6s, background 0.4s;
        }
        .battery-text {
            font-size: 1.125rem;
            font-weight: 600;
            color: #f1f5f9;
        }
        .battery-status {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-left: 0.25rem;
        }

        /* Disk list */
        .disk-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .disk-row:last-child {
            margin-bottom: 0;
        }
        .disk-mount {
            font-size: 0.8125rem;
            color: #cbd5e1;
            min-width: 80px;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
        }
        .disk-bar-wrap {
            flex: 1;
            height: 6px;
            background: #334155;
            border-radius: 999px;
            overflow: hidden;
        }
        .disk-bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.6s;
        }
        .disk-pct {
            font-size: 0.75rem;
            color: #94a3b8;
            min-width: 40px;
            text-align: right;
        }

        /* Thermal sensors */
        .thermal-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }
        .thermal-chip {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            background: #334155;
            border-radius: 0.375rem;
            padding: 0.375rem 0.625rem;
            font-size: 0.8125rem;
        }
        .thermal-chip-name {
            color: #94a3b8;
        }
        .thermal-chip-val {
            font-weight: 600;
            color: #f1f5f9;
        }

        /* Load averages */
        .load-row {
            display: flex;
            gap: 1.5rem;
        }
        .load-item {
            text-align: center;
        }
        .load-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f1f5f9;
        }
        .load-label {
            font-size: 0.6875rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.125rem;
        }

        /* Empty state */
        .dash-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #475569;
        }
        .dash-empty-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.4;
        }
        .dash-empty-text {
            font-size: 1rem;
            color: #64748b;
        }
        .dash-empty-sub {
            font-size: 0.8125rem;
            color: #475569;
            margin-top: 0.25rem;
        }
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* Network interfaces */
        .net-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .net-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8125rem;
        }
        .net-name {
            color: #94a3b8;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
        }
        .net-addr {
            color: #cbd5e1;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
        }

        /* Status indicator */
        .status-indicator {
            position: fixed;
            bottom: 12px;
            right: 12px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #475569;
            transition: background 0.3s;
            z-index: 100;
        }
        .status-indicator.connected {
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
        }
        .status-indicator.disconnected {
            background: #ef4444;
        }

        /* Responsive adjustments */
        @media (max-width: 640px) {
            #kiosk-dashboard { padding: 1.25rem; }
            .dash-hostname { font-size: 1.5rem; }
            .dash-header { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .dash-grid { grid-template-columns: 1fr; }
        }
        @media (min-width: 1600px) {
            .dash-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>
    <div id="kiosk-container">
        <div id="kiosk-blank"></div>
        <div id="kiosk-message">
            <h1 id="message-title"></h1>
            <p id="message-text"></p>
        </div>
        <iframe id="kiosk-iframe" sandbox="allow-scripts allow-same-origin"></iframe>

        <div id="kiosk-dashboard">
            <div class="dash-header">
                <div>
                    <div class="dash-hostname" id="dash-hostname">Waiting for data&hellip;</div>
                    <div class="dash-meta" id="dash-meta"></div>
                </div>
                <div class="dash-meta" id="dash-meta-right"></div>
            </div>
            <div class="dash-grid" id="dash-grid">
                <!-- Cards are injected by JS -->
                <div class="dash-empty" id="dash-empty">
                    <svg class="dash-empty-icon pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                    <div class="dash-empty-text">Connecting&hellip;</div>
                    <div class="dash-empty-sub">System stats will appear shortly</div>
                </div>
            </div>
        </div>
    </div>
    <div id="status-indicator" class="status-indicator disconnected"></div>

    <script>
        const token = new URLSearchParams(window.location.search).get('token') || '';
        const wsUrl = `ws://${window.location.host}/ws?token=${encodeURIComponent(token)}`;

        let ws = null;
        let reconnectTimer = null;
        let pingTimer = null;
        let latestStats = null;

        const blankEl = document.getElementById('kiosk-blank');
        const messageEl = document.getElementById('kiosk-message');
        const messageTitleEl = document.getElementById('message-title');
        const messageTextEl = document.getElementById('message-text');
        const iframeEl = document.getElementById('kiosk-iframe');
        const dashboardEl = document.getElementById('kiosk-dashboard');
        const statusEl = document.getElementById('status-indicator');

        function connect() {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
                return;
            }

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('[kiosk] connected');
                statusEl.className = 'status-indicator connected';
                startPing();
            };

            ws.onclose = () => {
                console.log('[kiosk] disconnected');
                statusEl.className = 'status-indicator disconnected';
                stopPing();
                scheduleReconnect();
            };

            ws.onerror = (e) => {
                console.error('[kiosk] ws error', e);
            };

            ws.onmessage = (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    handleMessage(msg);
                } catch (err) {
                    console.error('[kiosk] parse error', err);
                }
            };
        }

        function handleMessage(msg) {
            if (msg.type === 'content') {
                applyContent(msg.content);
            } else if (msg.type === 'stats') {
                latestStats = msg.data;
                renderDashboard(msg.data);
            } else if (msg.type === 'pong') {
                // Keepalive response
            }
        }

        function applyContent(content) {
            blankEl.style.display = 'none';
            messageEl.style.display = 'none';
            iframeEl.style.display = 'none';
            dashboardEl.style.display = 'none';

            switch (content.kind) {
                case 'blank':
                    blankEl.style.display = 'flex';
                    break;

                case 'dashboard':
                    dashboardEl.style.display = 'block';
                    if (latestStats) renderDashboard(latestStats);
                    break;

                case 'message':
                    messageTitleEl.textContent = content.title || '';
                    messageTextEl.textContent = content.text || '';
                    messageEl.style.display = 'flex';
                    break;

                case 'url':
                    iframeEl.src = content.url;
                    iframeEl.style.display = 'block';
                    break;

                default:
                    dashboardEl.style.display = 'block';
                    if (latestStats) renderDashboard(latestStats);
            }
        }

        // ── Helpers ──
        function fmtBytes(b) {
            if (b == null || b === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(b) / Math.log(1024));
            return (b / Math.pow(1024, i)).toFixed(i > 1 ? 1 : 0) + ' ' + units[i];
        }

        function fmtUptime(sec) {
            if (!sec) return '—';
            const d = Math.floor(sec / 86400);
            const h = Math.floor((sec % 86400) / 3600);
            const m = Math.floor((sec % 3600) / 60);
            if (d > 0) return `${d}d ${h}h ${m}m`;
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        function gaugeColor(pct) {
            if (pct < 60) return 'gauge-green';
            if (pct < 80) return 'gauge-yellow';
            if (pct < 90) return 'gauge-orange';
            return 'gauge-red';
        }

        function ringColor(pct) {
            if (pct < 60) return '#22c55e';
            if (pct < 80) return '#eab308';
            if (pct < 90) return '#f97316';
            return '#ef4444';
        }

        // ── Dashboard renderer ──
        function renderDashboard(s) {
            const emptyEl = document.getElementById('dash-empty');
            if (emptyEl) emptyEl.remove();

            // Header
            const hostnameEl = document.getElementById('dash-hostname');
            hostnameEl.textContent = s.hostname || 'Unknown Host';

            const metaEl = document.getElementById('dash-meta');
            const metaParts = [];
            if (s.platform) metaParts.push(cap(s.platform) + (s.release ? ' ' + s.release : ''));
            if (s.arch) metaParts.push(s.arch);
            if (s.kernelVersion) metaParts.push(s.kernelVersion);
            if (s.agentVersion) metaParts.push('Agent v' + s.agentVersion);
            metaEl.innerHTML = metaParts.map(t =>
                `<span class="dash-meta-item"><span class="dash-meta-dot"></span>${esc(t)}</span>`
            ).join('');

            const metaRightEl = document.getElementById('dash-meta-right');
            const rightParts = [];
            if (s.uptimeSec) rightParts.push('Uptime: ' + fmtUptime(s.uptimeSec));
            if (s.ts) {
                const d = new Date(s.ts);
                rightParts.push(d.toLocaleString());
            }
            metaRightEl.innerHTML = rightParts.map(t =>
                `<span class="dash-meta-item">${esc(t)}</span>`
            ).join('');

            // Build cards
            const grid = document.getElementById('dash-grid');
            grid.innerHTML = '';

            // CPU card with ring gauge
            const cpuPct = Math.round(s.cpu || 0);
            grid.appendChild(makeCard('CPU', `
                <div style="display:flex;align-items:center;gap:1.5rem">
                    <div class="ring-gauge">
                        <svg viewBox="0 0 100 100" width="100" height="100">
                            <circle class="ring-bg" cx="50" cy="50" r="42"/>
                            <circle class="ring-fill" cx="50" cy="50" r="42"
                                stroke="${ringColor(cpuPct)}"
                                stroke-dasharray="${2 * Math.PI * 42}"
                                stroke-dashoffset="${2 * Math.PI * 42 * (1 - cpuPct / 100)}"/>
                        </svg>
                        <div class="ring-label">${cpuPct}%</div>
                    </div>
                    <div>
                        <div class="dash-card-sub">${s.cpus || '—'} cores</div>
                        ${s.load ? `<div style="margin-top:0.75rem"><div class="load-row">
                            <div class="load-item"><div class="load-value">${s.load.load1?.toFixed(2) ?? '—'}</div><div class="load-label">1 min</div></div>
                            <div class="load-item"><div class="load-value">${s.load.load5?.toFixed(2) ?? '—'}</div><div class="load-label">5 min</div></div>
                            <div class="load-item"><div class="load-value">${s.load.load15?.toFixed(2) ?? '—'}</div><div class="load-label">15 min</div></div>
                        </div></div>` : ''}
                    </div>
                </div>
            `));

            // Memory card
            if (s.mem) {
                const memPct = s.mem.total ? Math.round(s.mem.used / s.mem.total * 100) : 0;
                grid.appendChild(makeCard('Memory', `
                    <div class="dash-card-value">${fmtBytes(s.mem.used)} <span style="font-size:0.875rem;font-weight:400;color:#94a3b8">/ ${fmtBytes(s.mem.total)}</span></div>
                    <div class="dash-card-sub">${memPct}% used &middot; ${fmtBytes(s.mem.free)} free</div>
                    <div class="gauge-track"><div class="gauge-fill ${gaugeColor(memPct)}" style="width:${memPct}%"></div></div>
                `));
            }

            // Battery card
            if (s.battery && s.battery.devices && s.battery.devices.length > 0) {
                const dev = s.battery.devices[0];
                const pct = Math.round(dev.percent || 0);
                const statusText = dev.status ? cap(dev.status) : '';
                const isCharging = dev.status === 'charging';
                const batColor = pct > 50 ? '#22c55e' : (pct > 20 ? '#eab308' : '#ef4444');

                let extra = '';
                if (dev.powerNowW) extra += `${dev.powerNowW.toFixed(1)}W`;
                if (dev.voltageNowV) extra += (extra ? ' · ' : '') + `${dev.voltageNowV.toFixed(2)}V`;
                if (dev.tempC) extra += (extra ? ' · ' : '') + `${dev.tempC.toFixed(1)}°C`;
                if (dev.cycleCount) extra += (extra ? ' · ' : '') + `${dev.cycleCount} cycles`;
                if (dev.timeToEmptySec && dev.timeToEmptySec > 0 && !isCharging) {
                    extra += (extra ? ' · ' : '') + fmtUptime(dev.timeToEmptySec) + ' remaining';
                }
                if (dev.timeToFullSec && dev.timeToFullSec > 0 && isCharging) {
                    extra += (extra ? ' · ' : '') + fmtUptime(dev.timeToFullSec) + ' to full';
                }

                grid.appendChild(makeCard('Battery', `
                    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem">
                        <div class="battery-shell">
                            <div class="battery-icon">
                                <div class="battery-level" style="width:${pct}%;background:${batColor}"></div>
                            </div>
                        </div>
                        <span class="battery-text">${pct}%</span>
                        <span class="battery-status">${esc(statusText)}${isCharging ? ' ⚡' : ''}</span>
                    </div>
                    ${extra ? `<div class="dash-card-sub">${esc(extra)}</div>` : ''}
                    <div class="gauge-track"><div class="gauge-fill" style="width:${pct}%;background:${batColor}"></div></div>
                `));
            }

            // Disk cards (show up to 4 significant mounts in one card)
            if (s.disk && s.disk.length > 0) {
                const disks = s.disk.slice(0, 6);
                let diskHtml = '';
                for (const d of disks) {
                    const pct = Math.round(d.capacity || 0);
                    const used = d.used || 0;
                    const avail = d.avail || 0;
                    diskHtml += `<div class="disk-row">
                        <span class="disk-mount" title="${esc(d.fsName || '')}">${esc(d.mount)}</span>
                        <div class="disk-bar-wrap"><div class="disk-bar-fill ${gaugeColor(pct)}" style="width:${pct}%"></div></div>
                        <span class="disk-pct">${pct}%</span>
                    </div>`;
                }
                grid.appendChild(makeCard('Disk', diskHtml));
            }

            // Thermal sensors
            if (s.thermal && s.thermal.length > 0) {
                const chips = s.thermal
                    .filter(t => t.temperature > 0)
                    .slice(0, 8)
                    .map(t => {
                        const c = t.temperature < 60 ? '#22c55e' : (t.temperature < 80 ? '#eab308' : '#ef4444');
                        const label = t.label || t.sensorKey || 'Sensor';
                        return `<div class="thermal-chip">
                            <span class="thermal-chip-name">${esc(label)}</span>
                            <span class="thermal-chip-val" style="color:${c}">${t.temperature.toFixed(0)}°C</span>
                        </div>`;
                    }).join('');
                if (chips) grid.appendChild(makeCard('Thermal', `<div class="thermal-list">${chips}</div>`));
            }

            // Network interfaces
            if (s.netIfaces && s.netIfaces.length > 0) {
                const ifaces = s.netIfaces.slice(0, 6);
                const rows = ifaces.map(n => `<div class="net-row">
                    <span class="net-name">${esc(n.name)}</span>
                    <span class="net-addr">${esc(n.address)}</span>
                </div>`).join('');
                grid.appendChild(makeCard('Network', `<div class="net-list">${rows}</div>`));
            }

            // System health card
            const healthParts = [];
            if (s.securityPatchStatus) healthParts.push({ label: 'Patches', value: s.securityPatchStatus });
            if (s.timeSyncStatus) healthParts.push({ label: 'NTP Sync', value: s.timeSyncStatus });
            if (s.serviceHealth) {
                const sh = s.serviceHealth;
                const svc = `${sh.running}/${sh.total} running`;
                healthParts.push({ label: 'Services', value: svc + (sh.failed > 0 ? ` (${sh.failed} failed)` : '') });
            }
            if (s.lastReboot) {
                const d = new Date(s.lastReboot);
                healthParts.push({ label: 'Last Reboot', value: d.toLocaleDateString() + ' ' + d.toLocaleTimeString() });
            }
            if (healthParts.length > 0) {
                const html = healthParts.map(h => `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:0.375rem 0;border-bottom:1px solid #334155">
                        <span style="font-size:0.8125rem;color:#94a3b8">${esc(h.label)}</span>
                        <span style="font-size:0.8125rem;color:#cbd5e1;text-align:right;max-width:60%">${esc(h.value)}</span>
                    </div>
                `).join('');
                grid.appendChild(makeCard('System Health', html));
            }
        }

        function makeCard(label, innerHtml) {
            const card = document.createElement('div');
            card.className = 'dash-card';
            card.innerHTML = `<div class="dash-card-label">${esc(label)}</div>${innerHtml}`;
            return card;
        }

        function esc(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        function cap(str) {
            if (!str) return '';
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // ── WebSocket lifecycle ──
        function startPing() {
            stopPing();
            pingTimer = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, 30000);
        }

        function stopPing() {
            if (pingTimer) {
                clearInterval(pingTimer);
                pingTimer = null;
            }
        }

        function scheduleReconnect() {
            if (reconnectTimer) return;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connect();
            }, 2000);
        }

        connect();
    </script>
</body>
</html>
