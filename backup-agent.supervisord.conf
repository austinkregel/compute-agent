; Supervisord program config for the backup-agent.
; Place this file in e.g. /etc/supervisor/conf.d/backup-agent.conf
;
; Assumptions for deployment layout:
; - /opt/agent/backup-agent        (the agent binary)
; - /opt/agent/agent-config.json   (the JSON config)
;
[program:backup-agent]
; Run from /opt/agent so the default ./agent-config.json resolution works.
directory=/opt/agent

; With directory=/opt/agent, the agent will load ./agent-config.json by default.
command=/opt/agent/backup-agent

; Recommended: run as a dedicated unprivileged user (create if needed).
;user=backup-agent

; Start/Restart behavior
autostart=true
autorestart=true
startsecs=2
startretries=10

; Clean shutdown on SIGTERM (agent listens for SIGINT/SIGTERM)
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true

; Log to files under /opt/agent to avoid missing /var/log dirs.
stdout_logfile=/opt/agent/backup-agent.stdout.log
stderr_logfile=/opt/agent/backup-agent.stderr.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile_backups=10

; Environment (optional). You can uncomment to force config selection.
environment=CLIENT_CONFIG_PATH="/opt/agent/agent-config.json"

